# General settings
[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

# Window Settings
[window]
padding = { x = 12, y = 12 }
dynamic_padding = true

# Font Settings
[font]
size = 11.0

[font.normal]
family = "Hack"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

# Cursor Settings
[cursor]
style = { shape = "Beam", blinking = "Always" }
unfocused_hollow = true

# Terminal Selection / Clipboard
[selection]
save_to_clipboard = true

# Default colors
[colors.primary]
background = '#171d23'
foreground = '#ffffff'

# Cursor colors
[colors.cursor]
text   = '#fafafa'
cursor = '#008b94'

# Normal colors
[colors.normal]
black   = '#333f4a'
red     = '#d95468'
green   = '#8bd49c'
blue    = '#539afc'
magenta = '#b62d65'
cyan    = '#70e1e8'
white   = '#b7c5d3'

# Bright colors
[colors.bright]
black   = '#41505e'
red     = '#d95468'
green   = '#8bd49c'
yellow  = '#ebbf83'
blue    = '#5ec4ff'
magenta = '#e27e8d'
cyan    = '#70e1e8'
white   = '#ffffff'
